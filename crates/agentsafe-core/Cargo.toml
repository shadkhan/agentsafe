[package]
name = "agentsafe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-neutral prompt-injection scanner core for AgentSafe"

[dependencies]
base64 = "0.22"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scanner_bench"
harness = false
